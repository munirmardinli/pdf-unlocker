name: CI Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js Umgebung einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Abhängigkeiten installieren (npm ci)
        run: npm ci

      - name: Projekt bauen (npm run build)
        run: npm run build
