name: CI Build & Publish Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js Umgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Abhängigkeiten installieren (npm ci)
        run: npm ci

      - name: Projekt bauen (npm run build)
        run: npm run build

      - name: Statische Dateien (out) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          retention-days: 7

      - name: In docs-Branch veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: docs
          force_orphan: true
